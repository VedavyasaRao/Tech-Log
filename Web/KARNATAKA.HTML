<AREA HREF="" TARGET="" ALT1="Golgumbaz,Bijapur" SHAPE="rect" COORDS="0,-3,128,123" 
ALT="The dome is the second largest in the world, 124 feet in diameter. The architecture of 
this building is unique with the four minarets being the four staircases leading to the top 
dome. The acoustics of the enclosed space make it a whispering gallery, where even the 
smallest sound is heard across the other side of the Gombuz. At the periphery of the dome 
is a circular balcony where visitors can witness its greatest marvel, ECHO. 
Any wisper, clap or sound gets echoed 9 times (11 times with fading) and creates an ideal 
stereophonic stage even for the weak-lunged singers. Even the smallest wisper amplifies 
and is clearly heard at the diagnonally opposite side of the dome.">

<AREA HREF="" TARGET="" ALT1="Cave Temple, Badami" SHAPE="rect" COORDS="126,-5,346,143"
ALT="Badami was the capital of the early Chalukyas of the 6th - century. There are four rock-cut temples 
replete with carved pillars and bracket figures. There are fragments of magnificent 
frescoes in some of the caves. The cave temples of Badami , a few miles west of Pattadkal, 
were hewn out of solid rock, as early as 550 A.D. The pattern is similar: a veranda 
with pillars, a hall with columns, and a small cell for the deity. 
The exterior is plain but the interior is lavishly adorned. 
The first cave goes deep into the rock. Dwarfs occupy the front of the veranda with a 
Nandi bull on the left and 18-armed Shiva on the right. There are also images of Vishnu, 
and goddess Durga.">

<AREA HREF="" TARGET="" ALT1="Stone Chariot, Hampi" SHAPE="rect" COORDS="347,-7,513,114"
ALT="If dreams were made out of stone, it would be Hampi
The famous Stone Chariot with stone wheels that actually revolve. In front of the shrine 
stands the great mantapa. Resting on a richly sculpted basement, its roof is supported 
by huge pillars of granite, about 15 feet in height, each consisting of a central pillar 
surrounded by detached shafts, all cut from one single block of stone.">

<AREA HREF="" TARGET="" ALT1="Gandabherunda" SHAPE="rect" COORDS="543,5,611,85"
ALT="The fictious two headed eagle is the offical symbol of the state of mysore.">

<AREA HREF="" TARGET="" ALT1="Karnataka" SHAPE="rect" COORDS="6,140,211,187"
ALT="A southeren state of India, with bangalore as its capital is the host of all the 
architecture spledour you have been seeing now.">

<AREA HREF="" TARGET="" ALT1="Shilabalike,Belur" SHAPE="rect" COORDS="9,194,141,445"
ALT="If the pyramids and parthenons represent the architectures of Egypt and Greece, temples at 
Belur and HaleBeedu represent the fine sculpture of Indian Architecture.
Karnataka is represented by the Shilabaalike which has so many artistic poses in Belur. 
Women the world over study and redo the hairstyles, dances, reliving the feminine charm 
these statues have always stood for.">

<AREA HREF="" TARGET="" ALT1="Vidhana Soudha,Bangalore" SHAPE="rect" COORDS="187,115,405,275"
ALT="The Vidhana Soudha is one of Bangalores, and indeed one of Indias most spectacular buildings. 
This imposing edifice built almost entirely of dressed Bangalore granite, in the 
neo-dravidian style, is a tribute to temple architecture.">

<AREA HREF="" TARGET="" ALT1="Mysore Palace,Mysore" SHAPE="rect" COORDS="150,263,439,444"
ALT="The grand palace with its four arched entrances stands at the centre of the town. 
Liberally covered with golden domes and home to the most expensive royal chair (Simhasana), 
made of gold and studded with diamond and precious stones, this palace rivals the best in 
the world. During weekends the whole palace is lit with thousands of lights, a great sight.">

<AREA HREF="" TARGET="" ALT1="Channakeshava Temple.Halebeedu" SHAPE="rect" COORDS="436,118,640,440"
ALT="Located in the Hassan district, these temples are dedicated to Vishnu, the chief deity of 
the Hoysala dynasty. The sculptor Jakkanna tried out the Channa Keshava temple at Belur as 
an experiment to build the larger and more exquisite temple at Halebeedu.">
